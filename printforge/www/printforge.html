<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrintForge</title>
    <!-- Quill WYSIWYG Editor -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <style>
        .ql-container.ql-snow {
            border: 1px solid var(--bd) !important;
            border-radius: 0 0 4px 4px;
            background: var(--b0);
            color: var(--t0);
            font-family: inherit !important;
        }

        .ql-toolbar.ql-snow {
            border: 1px solid var(--bd) !important;
            border-radius: 4px 4px 0 0;
            background: var(--b2);
            border-bottom: none !important;
        }

        .ql-snow .ql-stroke {
            stroke: var(--t2) !important;
        }

        .ql-snow .ql-fill {
            fill: var(--t2) !important;
        }

        .ql-snow .ql-picker {
            color: var(--t2) !important;
        }

        .ql-editor {
            min-height: 120px;
            font-size: 13px;
            line-height: 1.6;
        }

        .ql-editor.ql-blank::before {
            color: var(--t2) !important;
            font-style: normal !important;
        }
    </style>
</head>

<body>
    {% if bundle_built %}
    <div id="root"></div>
    <script>
        window.PF_FRAPPE = {
            csrf_token: {{ csrf_token | tojson }},
            user: {{ pf_user | tojson }},
            site: {{ pf_site | tojson }}
        };
    </script>
    <script type="module" src="/assets/printforge/dist/printforge.js?v={{ build_version }}"></script>
    {% else %}
    <p style="font-family: sans-serif; padding: 40px;">The PrintForge bundle has not been built. Run <code>npm install &amp;&amp; npm run build:frappe</code> in the app folder, then <code>bench build --app printforge</code>.</p>
    {% endif %}
</body>

</html>
